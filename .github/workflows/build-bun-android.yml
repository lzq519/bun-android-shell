name: Build Bun for Android

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: bun-v1.1.20
          submodules: recursive
      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash
      - name: Build Bun
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --force
          bun build src/bun.ts --compile --outfile bun-android-arm64-v8a --minify
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-arm64-v8a
          path: ./bun-android-arm64-v8a
