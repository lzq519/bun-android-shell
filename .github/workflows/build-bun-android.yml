# 工作流名称
name: Build Bun with Android NDK

# 触发条件：push 到 main 分支 / 手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

# 工作流任务
jobs:
  build-bun-android:
    # 运行环境：Ubuntu 最新版（推荐 22.04）
    runs-on: ubuntu-22.04
    
    # 配置矩阵：编译不同的 Android 架构（按需调整）
    strategy:
      fail-fast: false # 一个架构编译失败不影响其他
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64] # 主流 Android 架构
    
    steps:
      # 步骤1：检出 Bun 源码
      - name: Checkout Bun source code
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun # Bun 官方仓库
          ref: main # 可替换为指定版本（如 bun-v1.0.25）
          submodules: recursive # 拉取子模块（Bun 依赖子模块）
          fetch-depth: 0 # 完整拉取历史，避免编译依赖缺失

      # 步骤2：安装 Android NDK（指定版本，适配 Bun 编译）
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b # 推荐 r25b（兼容 Bun 编译，新版可能有兼容问题）
          add-to-path: true # 将 NDK 加入环境变量

      # 步骤3：配置编译环境（安装依赖 + 设置 NDK 环境变量）
      - name: Setup build environment
        run: |
          # 安装系统依赖
          sudo apt update && sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            curl \
            unzip
          
          # 根据架构映射 NDK 目标三元组（关键：NDK 编译必须指定）
          case ${{ matrix.arch }} in
            arm64-v8a)
              export TARGET_TRIPLE=aarch64-linux-android
              export ANDROID_ABI=arm64-v8a
              export ANDROID_PLATFORM=android-24
              ;;
            armeabi-v7a)
              export TARGET_TRIPLE=armv7a-linux-androideabi
              export ANDROID_ABI=armeabi-v7a
              export ANDROID_PLATFORM=android-24
              ;;
            x86_64)
              export TARGET_TRIPLE=x86_64-linux-android
              export ANDROID_ABI=x86_64
              export ANDROID_PLATFORM=android-24
              ;;
          esac
          
          # 将环境变量持久化到后续步骤
          echo "TARGET_TRIPLE=$TARGET_TRIPLE" >> $GITHUB_ENV
          echo "ANDROID_ABI=$ANDROID_ABI" >> $GITHUB_ENV
          echo "ANDROID_PLATFORM=$ANDROID_PLATFORM"
          echo "NDK_PATH=${ANDROID_NDK_HOME}" >> $GITHUB_ENV

      # 步骤4：编译 Bun（核心步骤，基于 NDK 交叉编译）
      - name: Build Bun with NDK
        run: |
          # 进入 Bun 源码根目录
          cd $GITHUB_WORKSPACE
          
          # 设置 Bun 编译的环境变量（指定 NDK 工具链）
          export CC=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET_TRIPLE}${ANDROID_PLATFORM}-clang
          export CXX=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET_TRIPLE}${ANDROID_PLATFORM}-clang++
          export AR=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export LD=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld
          export STRIP=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          
          # 执行 Bun 编译脚本（针对 Android 交叉编译）
          ./scripts/build-android.sh \
            --arch ${{ matrix.arch }} \
            --ndk ${NDK_PATH} \
            --platform ${ANDROID_PLATFORM}
          
          # 验证编译产物
          ls -la ./build/android/${{ matrix.arch }}/release/bun # 编译产物路径

      # 步骤5：上传编译产物（方便下载）
      - name: Upload Bun build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-${{ matrix.arch }}
          path: ./build/android/${{ matrix.arch }}/release/bun
          retention-days: 7 # 产物保留 7 天（可调整）
