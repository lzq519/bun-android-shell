name: build-bun-android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        arch: [armv7a, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            python3 \
            git \
            curl \
            unzip

      - name: Install Zig
        run: |
          curl -L https://ziglang.org/download/0.12.0/zig-linux-x86_64-0.12.0.tar.xz | tar -xJ
          sudo mv zig-linux-x86_64-0.12.0 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Download Android NDK
        run: |
          curl -L https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -o ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Clone Bun
        run: |
          git clone https://github.com/oven-sh/bun.git
          cd bun
          git submodule update --init --recursive

      - name: Set target
        run: |
          if [ "${{ matrix.arch }}" = "armv7a" ]; then
            echo "TARGET=armv7a-linux-androideabi" >> $GITHUB_ENV
            echo "API=21" >> $GITHUB_ENV
          else
            echo "TARGET=aarch64-linux-android" >> $GITHUB_ENV
            echo "API=21" >> $GITHUB_ENV
          fi

      - name: Setup NDK toolchain
        run: |
          TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64
          echo "CC=$TOOLCHAIN/bin/${TARGET}${API}-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++" >> $GITHUB_ENV

      - name: Build Bun
        run: |
          cd bun
          zig build \
            -Dtarget=${TARGET} \
            -Drelease-fast

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-${{ matrix.arch }}
          path: bun/build/bin/bun
