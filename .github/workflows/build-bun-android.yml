name: Build Bun for Android ARM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-bun-android:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch_config:
          - arch_name: arm64-v8a
            make_target: android-aarch64
            toolchain_triple: aarch64-linux-android
            target_arch: aarch64
          - arch_name: armeabi-v7a
            make_target: android-armv7
            toolchain_triple: armv7a-linux-androideabi
            target_arch: armv7
    steps:
      - name: Checkout Bun source code
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: bun-v1.1.20
          submodules: recursive
          fetch-depth: 0

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Setup build environment
        run: |
          # 安装系统依赖（移除 jq，无需再解析 yaml）
          sudo apt update && sudo apt install -y \
            build-essential cmake ninja-build python3 python3-pip \
            curl unzip pkg-config libssl-dev file git
          
          # 安装 Bun （先装 Bun，用其内置包管理器替代 pnpm）
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          echo "PATH=$HOME/.bun/bin:$PATH" >> $GITHUB_ENV
          
          # 提取矩阵配置
          export ARCH_NAME=${{ matrix.arch_config.arch_name }}
          export MAKE_TARGET=${{ matrix.arch_config.make_target }}
          export TOOLCHAIN_TRIPLE=${{ matrix.arch_config.toolchain_triple }}
          export TARGET_ARCH=${{ matrix.arch_config.target_arch }}
          export ANDROID_PLATFORM=android-24
          
          # 32位ARM编译参数
          if [ "$ARCH_NAME" = "armeabi-v7a" ]; then
            export EXTRA_CFLAGS="-march=armv7-a -mfloat-abi=softfp -mfpu=vfpv3-d16 -fPIC"
          else
            export EXTRA_CFLAGS="-fPIC"
          fi
          
          # 持久化环境变量
          echo "ARCH_NAME=$ARCH_NAME" >> $GITHUB_ENV
          echo "MAKE_TARGET=$MAKE_TARGET" >> $GITHUB_ENV
          echo "TOOLCHAIN_TRIPLE=$TOOLCHAIN_TRIPLE" >> $GITHUB_ENV
          echo "TARGET_ARCH=$TARGET_ARCH" >> $GITHUB_ENV
          echo "ANDROID_PLATFORM=$ANDROID_PLATFORM" >> $GITHUB_ENV
          echo "EXTRA_CFLAGS=$EXTRA_CFLAGS" >> $GITHUB_ENV
          echo "NDK_ROOT=${ANDROID_NDK_HOME}" >> $GITHUB_ENV

      - name: Install Bun dependencies (用 Bun 替代 pnpm，彻底规避配置问题)
        run: |
          cd $GITHUB_WORKSPACE
          # 核心修复：用 bun install 替代 pnpm install，自动兼容 workspaces
          bun install --force
          # 验证依赖安装成功
          bun pm ls

      - name: Build Bun for Android ARM
        run: |
          cd $GITHUB_WORKSPACE
          
          # 配置 NDK 工具链
          export TOOLCHAIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${TOOLCHAIN_TRIPLE}${ANDROID_PLATFORM}-clang
          export CXX=$TOOLCHAIN/bin/${TOOLCHAIN_TRIPLE}${ANDROID_PLATFORM}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export LD=$TOOLCHAIN/bin/ld.lld
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          # 编译参数
          export CFLAGS="--target=${TOOLCHAIN_TRIPLE}${ANDROID_PLATFORM} $EXTRA_CFLAGS"
          export CXXFLAGS="--target=${TOOLCHAIN_TRIPLE}${ANDROID_PLATFORM} $EXTRA_CFLAGS"
          export LDFLAGS="-L$TOOLCHAIN/sysroot/usr/lib/${TOOLCHAIN_TRIPLE}/${ANDROID_PLATFORM} -llog -pie -fPIE"
          
          # 环境变量传递给 Make
          export BUN_TARGET_TRIPLE=${TOOLCHAIN_TRIPLE}
          export BUN_ANDROID_NDK=$NDK_ROOT
          export BUN_ANDROID_PLATFORM=$ANDROID_PLATFORM
          
          # 执行正确的 Make 目标
          echo "编译目标：$MAKE_TARGET"
          make $MAKE_TARGET
          
          # 验证产物
          BUN_OUTPUT_PATH="./build/bun-$MAKE_TARGET"
          ls -la $BUN_OUTPUT_PATH
          file $BUN_OUTPUT_PATH

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-${{ env.ARCH_NAME }}
          path: ./build/bun-${{ env.MAKE_TARGET }}
          retention-days: 7
