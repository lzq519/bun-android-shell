name: Build Bun for Android ARM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-bun-android:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch_config:
          - arch_name: arm64-v8a
            target_triple: aarch64-linux-android
            target_arch: aarch64
            ndk_arch: arm64
          - arch_name: armeabi-v7a
            target_triple: armv7a-linux-androideabi
            target_arch: arm
            ndk_arch: arm
    steps:
      - name: Checkout Bun source code
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: bun-v1.1.20
          submodules: recursive
          fetch-depth: 0

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Setup build environment
        run: |
          # 安装系统依赖
          sudo apt update && sudo apt install -y \
            build-essential cmake ninja-build python3 python3-pip \
            curl unzip pkg-config libssl-dev file git
          
          # 安装 Bun 运行时（用于交叉编译）
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          echo "PATH=$HOME/.bun/bin:$PATH" >> $GITHUB_ENV
          
          # 验证 Bun 安装
          bun --version
          
          # 提取矩阵配置并持久化
          export ARCH_NAME=${{ matrix.arch_config.arch_name }}
          export TARGET_TRIPLE=${{ matrix.arch_config.target_triple }}
          export TARGET_ARCH=${{ matrix.arch_config.target_arch }}
          export NDK_ARCH=${{ matrix.arch_config.ndk_arch }}
          export ANDROID_PLATFORM=android-24
          
          echo "ARCH_NAME=$ARCH_NAME" >> $GITHUB_ENV
          echo "TARGET_TRIPLE=$TARGET_TRIPLE" >> $GITHUB_ENV
          echo "TARGET_ARCH=$TARGET_ARCH" >> $GITHUB_ENV
          echo "NDK_ARCH=$NDK_ARCH" >> $GITHUB_ENV
          echo "ANDROID_PLATFORM=$ANDROID_PLATFORM" >> $GITHUB_ENV
          echo "NDK_ROOT=${ANDROID_NDK_HOME}" >> $GITHUB_ENV

      - name: Build Bun for Android (交叉编译核心步骤)
        run: |
          cd $GITHUB_WORKSPACE
          
          # 配置 NDK 交叉编译工具链
          export TOOLCHAIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${TARGET_TRIPLE}${ANDROID_PLATFORM}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET_TRIPLE}${ANDROID_PLATFORM}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export LD=$TOOLCHAIN/bin/ld.lld
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          # 架构专属编译参数
          if [ "$ARCH_NAME" = "armeabi-v7a" ]; then
            export CFLAGS="--target=${TARGET_TRIPLE}${ANDROID_PLATFORM} -march=armv7-a -mfloat-abi=softfp -mfpu=vfpv3-d16 -fPIC"
            export CXXFLAGS="--target=${TARGET_TRIPLE}${ANDROID_PLATFORM} -march=armv7-a -mfloat-abi=softfp -mfpu=vfpv3-d16 -fPIC"
          else
            export CFLAGS="--target=${TARGET_TRIPLE}${ANDROID_PLATFORM} -fPIC"
            export CXXFLAGS="--target=${TARGET_TRIPLE}${ANDROID_PLATFORM} -fPIC"
          fi
          
          # 链接参数（适配 Android 系统库）
          export LDFLAGS="-L$TOOLCHAIN/sysroot/usr/lib/${TARGET_TRIPLE}/${ANDROID_PLATFORM} -llog -pie -fPIE"
          
          # 核心：用 bun build 交叉编译 Bun 源码为 Android 可执行文件
          bun build \
            --target=bun-android-${TARGET_ARCH} \
            --compile \
            --outfile bun-android-${ARCH_NAME} \
            --cc $CC \
            --cxx $CXX \
            --ar $AR \
            --ld $LD \
            src/bun.ts
          
          # 验证产物
          echo "=== 编译产物信息 ==="
          ls -la ./bun-android-${ARCH_NAME}
          file ./bun-android-${ARCH_NAME}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-${{ env.ARCH_NAME }}
          path: ./bun-android-${{ env.ARCH_NAME }}
          retention-days: 7
