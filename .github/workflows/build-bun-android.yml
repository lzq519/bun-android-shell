name: Build Bun for Android ARM64

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Bun source code
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: bun-v1.1.20
          submodules: recursive
          fetch-depth: 0

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -y \
            build-essential cmake ninja-build python3 python3-pip \
            zig libssl-dev git curl unzip
          # 安装 Bun 仅用于依赖管理（非编译）
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"

      - name: Build Bun for Linux ARM64 (Android compatible)
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export TARGET_ARCH=aarch64
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          
          # 配置交叉编译环境
          export CC=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android24-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export LD=$TOOLCHAIN/bin/ld.lld
          export CFLAGS="-fPIC --target=aarch64-linux-android24"
          export CXXFLAGS="-fPIC --target=aarch64-linux-android24"
          
          # 安装 Bun 源码依赖
          bun install --force
          
          # 执行 Bun 官方 Linux ARM64 编译脚本（Android 兼容）
          ./scripts/build-linux.sh --arch $TARGET_ARCH
          
          # 验证产物
          ls -la ./build/out/bun-linux-$TARGET_ARCH
          file ./build/out/bun-linux-$TARGET_ARCH

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-arm64-v8a
          path: ./build/out/bun-linux-aarch64
          retention-days: 7
