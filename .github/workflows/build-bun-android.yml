name: build-bun-android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        arch: [armv7a, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            python3 \
            git \
            curl \
            unzip

      - name: install zig 0.11
        run: |
          curl -L https://ziglang.org/download/0.11.0/zig-linux-x86_64-0.11.0.tar.xz | tar -xJ
          sudo mv zig-linux-x86_64-0.11.0 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

      - name: download android ndk
        run: |
          curl -L https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -o ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: clone bun
        run: |
          git clone https://github.com/oven-sh/bun.git
          cd bun
          git submodule update --init --recursive

      - name: apply patch
        run: |
          cd bun
          patch -p1 < ../patches/android-target.patch

      - name: build
        run: |
          bash scripts/build-android.sh ${{ matrix.arch }}

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-${{ matrix.arch }}
          path: out/bun
