name: build-bun-android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - arch: armv7
            target: armv7a-linux-androideabi
            abi: armeabi-v7a
          - arch: armv8
            target: aarch64-linux-android
            abi: arm64-v8a

    env:
      API_LEVEL: 24
      ANDROID_NDK_VERSION: r26d

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            curl \
            unzip \
            build-essential

      - name: Install Zig
        run: |
          curl -L https://ziglang.org/builds/zig-linux-x86_64-0.12.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.12.0" >> $GITHUB_PATH

      - name: Install Android NDK
        run: |
          curl -L https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip -o ndk.zip
          unzip ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: Setup toolchain
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Clone bun
        run: |
          git clone https://github.com/oven-sh/bun.git
          cd bun
          git submodule update --init --recursive

      - name: Build bun
        run: |
          cd bun

          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64

          if [ "${{ matrix.arch }}" = "armv8" ]; then
            export CC=$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang
            export CXX=$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang++
          else
            export CC=$TOOLCHAIN/bin/armv7a-linux-androideabi${API_LEVEL}-clang
            export CXX=$TOOLCHAIN/bin/armv7a-linux-androideabi${API_LEVEL}-clang++
          fi

          mkdir build
          cd build

          cmake .. \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_ARCH_ABI=${{ matrix.abi }} \
            -DCMAKE_ANDROID_NDK=$ANDROID_NDK_HOME \
            -DCMAKE_ANDROID_API=${API_LEVEL} \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_BUILD_TYPE=Release

          ninja bun

      - name: Package
        run: |
          mkdir -p out/${{ matrix.arch }}
          cp bun/build/bun out/${{ matrix.arch }}/

      - uses: actions/upload-artifact@v4
        with:
          name: bun-android-${{ matrix.arch }}
          path: out/${{ matrix.arch }}
