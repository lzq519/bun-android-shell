name: Build Bun for Android ARM v7 and v8

# ⚠️ EXPERIMENTAL: This workflow is for cross-compiling Bun to Android.
# It requires WebKit prebuilt for Android, which may not be available.
# See: https://github.com/oven-sh/WebKit/releases

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_local_webkit:
        description: "Force local WebKit build (skip download)"
        type: boolean
        default: false

jobs:
  build-bun-android:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_name: arm64-v8a
            zig_target: aarch64-linux-android
            target_arch: aarch64
          - arch_name: armeabi-v7a
            zig_target: armv7a-linux-androideabi
            target_arch: arm
    steps:
      - name: Checkout Bun source code
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: bun-v1.3.10
          submodules: recursive
          fetch-depth: 0

      - name: Install Zig manually
        run: |
          # 下载 Bun 兼容的 Zig 版本（0.15.2，适配 Bun v1.3.10）
          ZIG_VERSION=0.12.1
          ZIG_ARCH=x86_64-linux
          curl -fsSL https://ziglang.org/download/$ZIG_VERSION/zig-$ZIG_ARCH-$ZIG_VERSION.tar.xz -o zig.tar.xz
          
          # zig安装目录
          ZIG_DIR="$HOME/zig"
          mkdir -p ${ZIG_DIR}
          
          # 解压到 $HOME/zig （加入环境变量）
          sudo tar -xf zig.tar.xz -C ${ZIG_DIR} --strip-components=1
          # 验证 Zig 安装
          ${ZIG_DIR}/zig version
          
          # 设置环境变量供后续步骤使用
          echo "${ZIG_DIR}" >> $GITHUB_PATH
          echo "ZIG_INSTALLED=true" >> $GITHUB_OUTPUT
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y \
            build-essential cmake ninja-build python3 python3-pip \
            curl unzip pkg-config libssl-dev file git

      - name: Setup build environment
        run: |
          # 持久化环境变量
          echo "ARCH_NAME=${{ matrix.arch_name }}" >> $GITHUB_ENV
          echo "ZIG_TARGET=${{ matrix.zig_target }}" >> $GITHUB_ENV
          echo "TARGET_ARCH=${{ matrix.target_arch }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_HOME}" >> $GITHUB_ENV

          # NDK 工具链路径
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV

          # 设置交叉编译工具
          if [ "${{ matrix.arch_name }}" = "arm64-v8a" ]; then
            export TARGET_TRIPLE=aarch64-linux-android
          else
            export TARGET_TRIPLE=armv7a-linux-androideabi
          fi

          export CC=$TOOLCHAIN/bin/${TARGET_TRIPLE}24-clang
          export CXX=$TOOLCHAIN/bin/${TARGET_TRIPLE}24-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export LD=$TOOLCHAIN/bin/ld.lld

          echo "CC=$CC" >> $GITHUB_ENV
          echo "CXX=$CXX" >> $GITHUB_ENV
          echo "AR=$AR" >> $GITHUB_ENV
          echo "LD=$LD" >> $GITHUB_ENV
          echo "TARGET_TRIPLE=$TARGET_TRIPLE" >> $GITHUB_ENV

      - name: Check WebKit availability
        id: check-webkit
        run: |
          # 检查是否有 Android 的 WebKit prebuilt
          # WebKit releases: https://github.com/oven-sh/WebKit/releases
          # 命名格式: bun-webkit-android-arm64.tar.gz

          echo "Checking for Android WebKit prebuilt..."
          echo "zig_target: $ZIG_TARGET"
          echo "target_arch: $TARGET_ARCH"

          # 列出可用的 WebKit release
          echo "::warning::Android WebKit prebuilt may not be available."
          echo "::warning::If build fails, you may need to build WebKit locally."

          # 设置标志 - 如果用户强制使用本地构建
          if [ "${{ inputs.force_local_webkit }}" = "true" ]; then
            echo "FORCE_LOCAL_WEBKIT=true" >> $GITHUB_ENV
            echo "force_local_webkit=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Bun for Android
        run: |
          cd $GITHUB_WORKSPACE

          # 额外的 CMake 参数来处理 Android 交叉编译
          CMAKE_EXTRA_ARGS=""

          # 如果没有 Android WebKit prebuilt，尝试跳过 WebKit (不推荐)
          # 或者使用系统依赖
          if [ "${{ inputs.force_local_webkit }}" != "true" ]; then
            # 尝试下载预编译的 WebKit
            CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS -DWEBKIT_LOCAL=OFF"
          else
            # 使用本地 WebKit 构建
            CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS -DWEBKIT_LOCAL=ON"
          fi

          # 使用 Zig 进行交叉编译
          # 注意: Bun 的 build.zig 目前不完全支持 Android
          # 这个命令可能会失败，因为:
          # 1. 缺少 Android 的 WebKit prebuilt
          # 2. C++ 代码可能有 Android 特定的问题
          zig build \
            -Dtarget=${ZIG_TARGET} \
            -Doptimize=ReleaseFast \
            -Dforce-dynamic-linking \
            -Dstrip \
            --prefix /tmp/bun-install \
            install \
            || {
              echo "::error::Zig build failed for Android target"
              echo "::error::This is expected - Bun Android support is experimental"
              echo "::error::You may need to:"
              echo "::error::  1. Build WebKit for Android separately"
              echo "::error::  2. Patch Bun's C++ code for Android compatibility"
              exit 1
            }
            
          # 产物路径
          BUN_BINARY="/tmp/bun-install/bin/bun"
          OUTPUT_NAME="bun-android-${ARCH_NAME}"

          # 检查产物
          if [ -f "$BUN_BINARY" ]; then
            echo "=== 编译产物信息 ==="
            ls -la "$BUN_BINARY"
            file "$BUN_BINARY"
            
            # 重命名产物
            cp "$BUN_BINARY" "./${OUTPUT_NAME}"
            ls -la "./${OUTPUT_NAME}"
          else
            echo "::warning::Build failed - no output binary"
            ls -la /tmp/bun-install/bin/ 2>/dev/null || echo "No bin directory"
            exit 1
          fi

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-${{ env.ARCH_NAME }}
          path: ./bun-android-${{ env.ARCH_NAME }}
          retention-days: 7

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-debug-${{ env.ARCH_NAME }}
          path: |
            ${{ github.workspace }}/build.log
            /tmp/bun-install/**
          retention-days: 7
